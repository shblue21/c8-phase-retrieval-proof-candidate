name: Exact verification
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-verification.txt
      - run: python -m pip install -r requirements-verification.txt
      - run: python scripts/check_artifact_integrity.py
      - run: python scripts/verify.py
      - name: Install manuscript build tools
        run: sudo apt-get update && sudo apt-get install -y texlive-latex-recommended texlive-fonts-recommended lmodern poppler-utils
      - run: python scripts/build_paper.py
      - run: python scripts/check_artifact_integrity.py --rebuilt-pdf _build/PR26_Proof_Candidate.pdf
